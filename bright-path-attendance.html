<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Attendance</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b2a6f;--yel:#fcc92f;--bg:#f2f6fd;--card:#fff;--text:#12234d;--head:#0b2a6f;--muted:#5d6b8a;--line:#e1e8f5;--soft:#eaf1fd;--btn:#0b2a6f;--okbg:#e3f6ea;--ok:#15803d;--badbg:#fde6e6;--bad:#dc2626;--remb:#fff7dd;--c1:#0b3fa8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#161e33;--text:#e8edf8;--head:#dbe6ff;--muted:#9aa6c4;--line:#27324d;--soft:#1b2540;--btn:#2f5fd0;--okbg:#143222;--ok:#4ade80;--badbg:#3a1a1c;--bad:#f87171;--remb:#2e2a14;--c1:#6f9bff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#161e33;--text:#e8edf8;--head:#dbe6ff;--muted:#9aa6c4;--line:#27324d;--soft:#1b2540;--btn:#2f5fd0;--okbg:#143222;--ok:#4ade80;--badbg:#3a1a1c;--bad:#f87171;--remb:#2e2a14;--c1:#6f9bff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;min-height:100vh}
aside{width:250px;flex:none;background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:16px 10px;position:sticky;top:env(safe-area-inset-top,0px);align-self:flex-start;height:calc(100vh - env(safe-area-inset-top,0px));overflow-y:auto}
.brand{display:flex;gap:8px;align-items:center;padding:0 6px 14px}
.bn{font-weight:800;font-size:1.2rem;line-height:1.1}.bn span{display:block;color:var(--yel);letter-spacing:.25em;font-size:1rem;font-weight:600}
.tag{font-size:.7rem;opacity:.8;font-style:italic;margin-top:2px}
.hero{background:#fff;border-radius:14px;padding:3px;margin:0 2px 8px;overflow:hidden}.hero img{display:block;width:100%;height:auto;border-radius:11px}
.simg{display:none}
nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
nav button{display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;background:rgba(255,255,255,.1);border:0;color:#fff;font:inherit;font-size:.82rem;font-weight:600;padding:12px 6px;border-radius:12px;cursor:pointer;text-align:center}nav button span{font-size:1.3rem}
nav button.on{background:var(--yel);color:var(--navy)}
.slogan{margin-top:auto;padding:0 14px 16px;font-style:italic;font-weight:700;font-size:1.15rem;transform:rotate(-10deg);transform-origin:left bottom;border-bottom:3px solid var(--yel);width:fit-content;margin-left:14px}
main{flex:1;min-width:0}
.bar{background:var(--navy);color:#fff;display:flex;justify-content:flex-end;align-items:center;padding:12px 20px;gap:10px;position:relative;min-height:56px}
.ttl{font-family:Cinzel,Georgia,"Times New Roman",serif;font-weight:900;font-size:.9rem;letter-spacing:.05em;line-height:1.1;white-space:nowrap;background:var(--yel);color:#0b2a6f;padding:5px 8px 4px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.35);text-align:center}
.ttl span{display:block;color:#0b2a6f;font-size:.62em;font-weight:900;letter-spacing:.45em;margin-right:-.45em;margin-top:2px}
.hi{display:flex;gap:10px;align-items:center}.hi b{display:block}.hi small{opacity:.8}
.bar-r{display:flex;gap:14px;align-items:center}
.bell{position:relative;background:none;border:0;color:#fff;font-size:1.3rem;cursor:pointer}
.bell i{position:absolute;top:-4px;right:-6px;background:var(--bad);color:#fff;font:700 .65rem/1 system-ui;border-radius:999px;padding:3px 5px;font-style:normal}
.prof{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.12);padding:4px 12px 4px 4px;border-radius:999px;font-weight:600}
.av{background:#fff;color:var(--navy);width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.content{padding:16px 20px}
.banner{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 20px;background:var(--soft);border-radius:14px;margin-bottom:14px;flex-wrap:wrap;position:relative;overflow:hidden}
.bimg{height:110px;width:auto;border-radius:12px;position:relative;z-index:1;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.banner h1{margin:0;font-size:1.8rem;color:var(--head)}.banner p{margin:2px 0 0;color:var(--muted)}
.bi{display:flex;gap:14px;align-items:center}.bi>span{font-size:2.2rem}
.quote{font-style:italic;font-weight:600;border-left:4px solid var(--yel);padding:6px 14px;position:relative;z-index:1}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.kpi{display:flex;gap:12px;align-items:center;border-radius:14px;padding:14px;border:1px solid var(--line)}
.k1,.k4{background:var(--soft)}.k2{background:var(--okbg)}.k3{background:var(--badbg)}
.ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:1.3rem;flex:none}
.k1 .ic,.k4 .ic{background:var(--c1)}.k2 .ic{background:#22a355}.k3 .ic{background:#e84545}
.kpi small{color:var(--muted);display:block}.kpi b{font-size:1.9rem;line-height:1.1;display:block}
.k2 b,.k2 .s{color:var(--ok)}.k3 b,.k3 .s{color:var(--bad)}.k1 b,.k4 b{color:var(--head)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.card h2{font-size:1.05rem;margin:0 0 10px;color:var(--head)}.card h2 small{font-weight:400;color:var(--muted)}
.filt{display:flex;gap:12px;align-items:end;flex-wrap:wrap;background:var(--soft)}
.f{flex:1 1 150px}label{display:block;font-size:.85rem;font-weight:600;margin-bottom:4px}
select,input,textarea,button{font:inherit;color:inherit}
select,input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
textarea{min-height:90px;resize:vertical}
button{border:1px solid var(--line);background:var(--card);padding:10px 14px;border-radius:8px;cursor:pointer}
.primary{background:var(--btn);color:#fff;border-color:var(--btn);font-weight:600}
.danger{color:var(--bad)}.armed{background:var(--bad)!important;color:#fff!important;border-color:var(--bad)!important}
.two{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}
@media(max-width:980px){.two{grid-template-columns:1fr}}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse}
th{background:var(--soft);text-align:left;font-size:.85rem;padding:9px 8px}td{padding:8px;border-bottom:1px solid var(--line)}
.ck{width:38px;height:30px;border-radius:999px;border:0;background:var(--soft);color:var(--muted);padding:0}
.ck.ok.on{background:var(--okbg);color:var(--ok);font-weight:700}.ck.no.on{background:var(--badbg);color:var(--bad);font-weight:700}
.st{padding:3px 10px;border-radius:999px;font-size:.8rem}.st.p{background:var(--okbg);color:var(--ok)}.st.a{background:var(--badbg);color:var(--bad)}.st.u{background:var(--soft);color:var(--muted)}
.sum{display:flex;gap:16px;align-items:center}
.donut{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;flex:none}
.donut i{width:74px;height:74px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-style:normal;font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.leg div{display:flex;justify-content:space-between;gap:14px;margin:6px 0}
.qa{display:block;width:100%;text-align:left;margin-bottom:8px;font-weight:600}
.qa.main{background:var(--btn);color:#fff;border-color:var(--btn)}
.rem{background:var(--remb);border-radius:10px;padding:10px 12px;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.empty{color:var(--muted);text-align:center;padding:20px 0}.muted{color:var(--muted);font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 180px}
details{border-top:1px solid var(--line);padding:8px 0}summary{cursor:pointer;font-weight:600}
.hide{display:none!important}
@media(max-width:860px){
body{flex-direction:column}
aside{position:static;width:auto;height:auto;padding:10px;align-self:stretch;display:grid;grid-template-columns:165px minmax(0,1fr);gap:8px;align-items:start}.hero,nav{grid-column:1}.simg{display:block;grid-column:2;grid-row:1/3;align-self:stretch;width:100%;height:100%;min-height:0;object-fit:contain;background:#f1f2f6;border-radius:14px}
.slogan,.tag{display:none}.brand{padding-bottom:6px}
.hero{max-width:140px;margin:0 auto 6px}nav{margin-top:4px}nav button{padding:8px 4px;font-size:.8rem}nav button span{font-size:1.1rem}
.bar,.content{padding-left:12px;padding-right:12px}.ttl{font-size:.95rem}.banner h1{font-size:1.4rem}.bimg{height:64px}}
@media print{aside,.bar,#filters,.noprint{display:none!important}body{display:block}.two{grid-template-columns:1fr}}
</style>
</head>

<main>
  <header class="bar">
    
    <div class="bar-r"><button class="bell" data-a="go" data-p="dashboard" aria-label="Notifications">🔔<i id="badge"></i></button></div>
  </header>
  <div class="content">
    <div id="top"></div>
    <div id="filters" class="card filt">
      <div class="f" data-for="attendance students reports"><label for="cls">Class</label><select id="cls"></select></div>
      <div class="f" data-for="attendance reports"><label for="term">Term</label><select id="term"><option value="1">First Term</option><option value="2">Second Term</option><option value="3">Third Term</option></select></div>
      
      <div class="f" data-for="attendance"><label for="date">Date</label><input type="date" id="date"></div>
      <button class="primary" data-a="view" data-for="attendance">🔍 View Attendance</button>
    </div>
    <div id="view"></div>
  </div>
</main>
<script>
const CLASSES=["JSS 1","JSS 2","JSS 3","SS 1","SS 2","SS 3"],TERMS={1:"First Term",2:"Second Term",3:"Third Term"},KEY="bpa_attendance_v2";
let D={students:{},records:{},archives:[]};let hadLocal=false;
try{const r=JSON.parse(localStorage.getItem(KEY)||"null");if(r&&r.students){hadLocal=true;D=Object.assign(D,r);const m={};for(const k in D.records){const nk=k.split("|").slice(0,2).join("|");m[nk]=m[nk]||{};for(const d in D.records[k])m[nk][d]=Object.assign(m[nk][d]||{},D.records[k][d])}D.records=m}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
const snapshot=()=>JSON.stringify({app:"bright-path-attendance",version:1,savedAt:new Date().toISOString(),students:D.students,records:D.records,archives:D.archives},null,2);
function applyData(r){if(!r||typeof r!=="object"||!r.students)throw new Error("bad");D.students=r.students;D.records=r.records||{};D.archives=r.archives||[];save()}
async function exportFile(){const data=snapshot(),name="notes.json";
 try{if(window.claude&&claude.use){const d=await claude.use("downloads");if(d){await d.save({filename:name,data});return"ok"}}}catch(e){return"declined"}
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;document.body.append(a);a.click();a.remove();return"ok"}
async function fetchNotes(){const r=await fetch("notes.json?"+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("none");return r.json()}
const nmsg=t=>document.querySelectorAll("#nm").forEach(e=>e.textContent=t);
const $=id=>document.getElementById(id),today=()=>new Date().toLocaleDateString("en-CA"),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const studs=c=>D.students[c]||(D.students[c]=[]),recs=k=>D.records[k]||(D.records[k]={});
const PAGES=[["dashboard","Dashboard","🏠","Your school at a glance."],["attendance","Attendance","🗓️","Track and manage student attendance across all classes."],["students","Students","👥","Add and manage students in each class."],["settings","Settings","⚙️","Archive a session and start a new one."]];
let page="attendance";
$("cls").innerHTML=CLASSES.map(c=>`<option>${c}</option>`).join("");$("date").value=today();
const cur=()=>{const c=$("cls").value,t=$("term").value;return{c,t,date:$("date").value||today(),key:c+"|"+t}};

function stats(date){const valid=new Set();Object.values(D.students).forEach(l=>l.forEach(s=>valid.add(s.id)));const m={};
 for(const k in D.records){const d=D.records[k][date];if(!d)continue;for(const id in d){if(!valid.has(id))continue;if(d[id]==="P")m[id]="P";else if(!m[id])m[id]="A"}}
 const p=Object.values(m).filter(x=>x==="P").length;return{p,a:Object.keys(m).length-p,total:valid.size}}
function pending(date){return CLASSES.filter(c=>studs(c).length&&!Object.keys(D.records).some(k=>k.startsWith(c+"|")&&D.records[k][date]&&Object.keys(D.records[k][date]).length))}
const cards=()=>{const {date}=cur(),s=stats(date),n=s.p+s.a,pc=x=>(n?x/n*100:0).toFixed(1)+"%",t=date===today()?" Today":"";
 return `<div class="cards"><div class="kpi k1"><span class="ic">👥</span><div><small>Total Students</small><b>${s.total}</b><small>JSS 1 – JSS 3 | SS 1 – SS 3</small></div></div>
 <div class="kpi k2"><span class="ic">✓</span><div><small>Present${t}</small><b>${s.p}</b><small class="s">${pc(s.p)}</small></div></div>

const banner=p=>`<div class="banner"><div class="bi"><span>${p[2]}</span><div><h1>${p[1]}</h1><p>${p[3]}</p></div></div><img class="bimg" src="${BIMG}" alt="Bright Path Academy"></div>`;

function summary(){const s=stats(cur().date),n=s.p+s.a,r=n?s.p/n*100:0,bg=n?`conic-gradient(var(--c1) 0 ${r}%,var(--yel) ${r}% 100%)`:"var(--soft)",pc=x=>n?` (${(x/n*100).toFixed(1)}%)`:"";
 return `<div class="card"><h2>Attendance Summary</h2><div class="sum"><div class="donut" style="background:${bg}"><i>${Math.round(r)}%</i></div><div class="leg"><div><span><span class="dot" style="background:var(--c1)"></span>Present</span><b>${s.p}${pc(s.p)}</b></div><div><span><span class="dot" style="background:var(--yel)"></span>Absent</span><b>${s.a}${pc(s.a)}</b></div></div></div></div>`}
const saveBtn=()=>`<p style="margin:12px 0 0"><button class="primary" data-a="save">💾 Save changes</button> <span class="muted" id="sv">Changes also save automatically.</span></p>`;
const quick=()=>`<div class="card noprint"><h2>Quick Actions</h2><button class="qa main" data-a="markall" data-v="P">👥 Mark All Present</button><button class="qa" data-a="markall" data-v="A">👥 Mark All Absent</button><div class="rem"><b>💡 Reminder</b><br>Regular attendance builds discipline, confidence and better results.</div></div>`;

function vAtt(){const {c,t,date,key}=cur(),list=studs(c),day=(D.records[key]||{})[date]||{};
 const rows=list.map((st,i)=>{const v=day[st.id];return `<tr><td>${i+1}</td><td>${esc(st.name)}</td><td>${c}</td><td><button class="ck ok${v==="P"?" on":""}" data-a="mark" data-id="${st.id}" data-v="P">✓</button></td><td><button class="ck no${v==="A"?" on":""}" data-a="mark" data-id="${st.id}" data-v="A">✕</button></td><td><span class="st ${v==="P"?"p":v==="A"?"a":"u"}">${v==="P"?"Present":v==="A"?"Absent":"Unmarked"}</span></td></tr>`}).join("");
 return `<div class="two"><div class="card"><h2>👥 Attendance List – ${c} <small>(${TERMS[t]} · ${date})</small></h2>${list.length?`<div class="scroll"><table><tr><th>S/N</th><th>Student Name</th><th>Class</th><th>Present</th><th>Absent</th><th>Status</th></tr>${rows}</table></div>`:`<div class="empty">No students in ${c} yet. Add them in the Students page.</div>`}${saveBtn()}</div><div>${summary()}${quick()}</div></div>`}
function vDash(){const date=cur().date,p=pending(date);
 return `<div class="two"><div class="card"><h2>Classes not yet marked on ${date}</h2>${p.length?p.map(c=>`<div class="row" style="align-items:center;border-bottom:1px solid var(--line);padding:6px 0"><b>${c} <span class="muted">(${studs(c).length} students)</span></b><button data-a="openclass" data-cl="${c}">Mark attendance</button></div>`).join(""):`<div class="empty">${D.students&&Object.values(D.students).some(l=>l.length)?"All classes with students have been marked. 🎉":"Add students to get started."}</div>`}</div><div>${summary()}</div></div>`}
function vStu(){const {c}=cur(),l=studs(c);
 return `<div class="two"><div class="card"><h2>${c} class list (${l.length})</h2>${l.length?`<div class="scroll"><table><tr><th>S/N</th><th>Name</th><th></th></tr>${l.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.name)}</td><td><button class="danger" data-a="rmstu" data-id="${s.id}" data-c="1">Remove</button></td></tr>`).join("")}</table></div>`:`<div class="empty">No students yet.</div>`}${saveBtn()}</div>
 <div class="card"><h2>Add students to ${c}</h2><label for="names">One name per line</label><textarea id="names" placeholder="Adebayo Tolu&#10;Okafor Chisom"></textarea><p><button class="primary" data-a="addstu">Add to class</button></p></div></div>`}
const vCls=()=>`<div class="grid">${CLASSES.map(c=>`<div class="card"><h2>${c}</h2><p class="muted">${studs(c).length} students</p><button class="primary" data-a="openclass" data-cl="${c}">Open</button></div>`).join("")}</div>`;

function tally(key,id){let p=0,a=0;const r=D.records[key]||{};for(const d in r){if(r[d][id]==="P")p++;else if(r[d][id]==="A")a++}return[p,a]}
function vRep(){const {c,t,key}=cur(),l=studs(c);
 return `<div class="card"><h2>${c} · ${TERMS[t]}</h2>${l.length?`<div class="scroll"><table><tr><th>Name</th><th>Days present</th><th>Days absent</th><th>Rate</th></tr>${l.map(st=>{const[p,a]=tally(key,st.id);return `<tr><td>${esc(st.name)}</td><td>${p}</td><td>${a}</td><td>${p+a?Math.round(p/(p+a)*100)+"%":"–"}</td></tr>`}).join("")}</table></div>`:`<div class="empty">No students in this class.</div>`}</div>`}
function snap(a){let h="";CLASSES.forEach(c=>{const l=(a.students||{})[c]||[];if(!l.length)return;h+=`<details><summary>${c} (${l.length} students)</summary>`;
 for(const t in TERMS){const ks=Object.keys(a.records||{}).filter(k=>k.startsWith(c+"|"+t)),days=new Set();ks.forEach(k=>Object.keys(a.records[k]).forEach(d=>days.add(d)));
  h+=`<p class="muted">${TERMS[t]}: ${days.size} day(s) recorded</p><div class="scroll"><table><tr><th>Name</th><th>Present</th><th>Absent</th></tr>${l.map(s=>{let p=0,x=0;ks.forEach(k=>{for(const d in a.records[k]){if(a.records[k][d][s.id]==="P")p++;else if(a.records[k][d][s.id]==="A")x++}});return `<tr><td>${esc(s.name)}</td><td>${p}</td><td>${x}</td></tr>`}).join("")}</table></div>`}h+="</details>"});return h||`<p class="muted">No students in this archive.</p>`}
function vSet(){return `<div class="two"><div>
 <div class="card"><h2>Data file (notes.json)</h2><p class="muted">Beta storage: changes save in this browser. Download notes.json to keep a copy or share it, then replace the file in your repository. Loading a file replaces what is on screen.</p><div class="row"><button class="primary" data-a="dlnotes">⬇️ Download notes.json</button><button data-a="ldnotes" data-c="1">Load notes.json</button><button data-a="pullnotes" data-c="1">Load from site</button></div><input type="file" id="nfile" accept=".json,application/json" class="hide"><p class="muted" id="nm"></p></div>
 <div class="card"><h2>Archive this session</h2><p class="muted">Saves all classes, students and attendance under the name you choose, then blanks the site for a new session.</p><label for="an">Archive name</label><input id="an" placeholder="e.g. 2025/2026 Session"><label style="display:flex;gap:8px;align-items:center;margin:10px 0;font-weight:400"><input type="checkbox" id="keep" style="width:auto"> Keep student names (clear attendance only)</label><button class="primary" data-a="archive" data-c="1">Archive and start new session</button><p class="muted" id="am"></p></div></div>
 <div class="card"><h2>Archived sessions</h2>${D.archives.length?D.archives.slice().reverse().map(a=>`<div style="border-top:1px solid var(--line);padding-top:8px"><div class="row" style="align-items:center"><div><b>${esc(a.name)}</b><div class="muted">Archived ${a.date}</div></div><button class="danger" data-a="rmarch" data-id="${a.id}" data-c="1" style="flex:0 0 auto">Delete</button></div>${snap(a)}</div>`).join(""):`<div class="empty">Nothing archived yet.</div>`}<p class="muted">Data is saved in this browser on this device.</p></div></div>`}

function render(){
 
 
 
 const n=pending(today()).length;$("badge").textContent=n;$("badge").classList.toggle("hide",!n);
 $("nav").innerHTML=PAGES.map(p=>`<button data-a="go" data-p="${p[0]}" class="${p[0]===page?"on":""}"><span>${p[2]}</span>${p[1]}</button>`).join("");
 
 let any=false;document.querySelectorAll("[data-for]").forEach(e=>{const on=e.dataset.for.split(" ").includes(page);e.classList.toggle("hide",!on);any=any||on});$("filters").classList.toggle("hide",!any);
 const p=PAGES.find(x=>x[0]===page);$("top").innerHTML=banner(p)+(page==="dashboard"||page==="attendance"?cards():"");
 $("view").innerHTML={dashboard:vDash,attendance:vAtt,students:vStu,settings:vSet}[page]();
}
function csv(){const {c,t,key}=cur(),r=D.records[key]||{},ds=Object.keys(r).sort(),q=x=>'"'+String(x).replace(/"/g,'""')+'"',rows=[["Name","Class","Term",...ds,"Present","Absent"]];
 studs(c).forEach(st=>{let p=0,a=0;const cells=ds.map(d=>{const v=r[d][st.id]||"";if(v==="P")p++;if(v==="A")a++;return v});rows.push([st.name,c,TERMS[t],...cells,p,a])});return rows.map(x=>x.map(q).join(",")).join("\n")}
const A={
 go:b=>{page=b.dataset.p;render()},view:()=>render(),
 dlnotes:async()=>{const r=await exportFile();nmsg(r==="ok"?"notes.json is ready. Upload it to your repository to share these changes.":"Download cancelled.")},
 ldnotes:()=>{$("nfile").click()},
 pullnotes:async()=>{try{applyData(await fetchNotes());render();nmsg("Loaded notes.json from the site.")}catch(e){nmsg("No notes.json found on the site.")}},
 save:()=>{let ok=true;try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){ok=false}const t=new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});document.querySelectorAll("#sv").forEach(e=>e.textContent=ok?"✓ Saved at "+t:"Couldn’t save in this browser.")},
 openclass:b=>{$("cls").value=b.dataset.cl;page="attendance";render()},
 mark:b=>{const {key,date}=cur(),r=recs(key);r[date]=r[date]||{};const id=b.dataset.id,v=b.dataset.v;if(r[date][id]===v)delete r[date][id];else r[date][id]=v;save();render()},
 markall:b=>{const {c,key,date}=cur(),r=recs(key);r[date]=r[date]||{};studs(c).forEach(s=>r[date][s.id]=b.dataset.v);save();render()},
 addstu:()=>{const {c}=cur(),l=$("names").value.split("\n").map(x=>x.trim()).filter(Boolean);l.forEach(n=>studs(c).push({id:uid(),name:n}));save();render()},
 rmstu:b=>{const {c}=cur();D.students[c]=studs(c).filter(s=>s.id!==b.dataset.id);save();render()},
 
 
 
 
 
 archive:()=>{const name=$("an").value.trim();if(!name){render();$("am").textContent="Please type a name for this archive first.";return}
  const keep=$("keep").checked;D.archives.push({id:uid(),name,date:today(),students:JSON.parse(JSON.stringify(D.students)),records:JSON.parse(JSON.stringify(D.records))});
  D.records={};if(!keep)D.students={};save();render();$("am").textContent="Saved as “"+name+"”. The site is ready for a new session."},
 rmarch:b=>{D.archives=D.archives.filter(a=>a.id!==b.dataset.id);save();render()}
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;
 if(b.dataset.c&&!b.classList.contains("armed")){const o=b.textContent;b.classList.add("armed");b.textContent="Tap again to confirm";setTimeout(()=>{b.classList.remove("armed");b.textContent=o},3000);return}
 if(A[b.dataset.a])A[b.dataset.a](b)});
["cls","term","date"].forEach(i=>$(i).addEventListener("change",render));
document.addEventListener("change",e=>{if(e.target.id!=="nfile")return;const f=e.target.files[0];if(!f)return;f.text().then(t=>{applyData(JSON.parse(t));render();nmsg("Loaded "+f.name+".")}).catch(()=>nmsg("That file isn’t a valid notes.json."))});
if(!hadLocal)fetchNotes().then(r=>{applyData(r);render()}).catch(()=>{});
render();
</script>
